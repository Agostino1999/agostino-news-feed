name: Prova isolata foto e loghi
on:
  pull_request:
    paths: ['scripts/enrich-article-images.mjs', '.github/workflows/prova-foto-isolata.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prova recupero foto
        env:
          IMAGE_DEBUG: '1'
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {enrichArticle} from './scripts/enrich-article-images.mjs';
          const j=JSON.parse(fs.readFileSync('news.json','utf8'));
          const targets=['ANSA','il manifesto','Sky TG24','RomaToday','Il Messaggero','Tgcom24'];
          for(const source of targets){
            const a=j.news.find(x=>x.source===source&&!x.image);
            if(a){const out=await enrichArticle(a);console.log('CHECK',JSON.stringify({source:a.source,title:a.title,image:out.image||'',logo:out.logoUrl||''}));}
          }
          JS
