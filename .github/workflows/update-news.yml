name: Update Google News feed

on:
  workflow_dispatch:
schedule:
  - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: write

concurrency:
  group: update-news-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate news.json
        run: node scripts/generate-news.mjs

      - name: Commit updated feed
        run: |
          if git diff --quiet -- news.json; then
            echo "news.json unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json
          git commit -m "Update news feed"
          git push
