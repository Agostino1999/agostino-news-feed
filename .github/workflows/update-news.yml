name: Update Google News feed

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate-news.mjs"
      - "scripts/enrich-article-images.mjs"
      - "scripts/add-video-news.mjs"
      - "scripts/enrich-focus-news.mjs"
      - "scripts/editorial-selection.mjs"
      - "tests/test-editorial-coverage.mjs"
      - "news-freshness.mjs"
      - "test-news-freshness.mjs"
      - "source-policy.mjs"
      - "feed-images.mjs"
      - "scripts/polls-refresh-due.mjs"
      - "tests/test-polls-refresh-due.mjs"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

concurrency:
  group: update-news-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Juventus editorial coverage
        run: node --test tests/test-editorial-coverage.mjs

      - name: Verify publication dates and expired announcements
        run: node --test test-news-freshness.mjs

      - name: Preserve previous image cache
        run: cp news.json .previous-news.json

      - name: Generate news.json
        run: node scripts/generate-news.mjs

      - name: Enrich video news
        run: node scripts/add-video-news.mjs

      - name: Enrich focus sections
        run: node scripts/enrich-focus-news.mjs

      - name: Recover article photos and logos
        run: node scripts/enrich-article-images.mjs || echo "Image enrichment failed; publishing the normal feed"

      - name: Commit updated feed
        run: |
          if git diff --quiet -- news.json; then
            echo "news.json unchanged"
            exit 0
          fi

          GENERATED_NEWS="$(mktemp)"
          cp news.json "$GENERATED_NEWS"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git fetch origin main
            git reset --hard origin/main
            # A delayed run must not overwrite a feed published more recently.
            if ! node --input-type=module -e '
              import fs from "node:fs";
              const timestamp = (path) => {
                const feed = JSON.parse(fs.readFileSync(path, "utf8"));
                return Math.max(...[
                  feed.updatedAt,
                  feed.videoEnrichment?.updatedAt,
                  feed.focusEnrichment?.updatedAt
                ].map(value => Date.parse(value) || 0));
              };
              const generated = timestamp(process.argv[1]);
              const current = timestamp(process.argv[2]);
              if (!generated) throw new Error("Generated feed has no valid timestamp");
              process.exit(generated > current ? 0 : 1);
            ' "$GENERATED_NEWS" news.json; then
              echo "A newer or equal feed is already published; skipping this run"
              exit 0
            fi

            cp "$GENERATED_NEWS" news.json

            if git diff --quiet -- news.json; then
              echo "news.json already current"
              exit 0
            fi

            git add news.json
            git commit -m "Update news feed"

            if git push origin HEAD:main; then
              echo "Push successful"
              exit 0
            fi

            echo "Push failed, retrying..."
            sleep 5
          done

          echo "Push failed after 3 attempts"
          exit 1

      # Cloudflare dispatches this workflow every five minutes. Use that reliable
      # trigger to recover polling checks missed by GitHub's separate schedule.
      # News is already published before any polling work starts.
      - name: Check polling archive freshness
        id: polls
        run: |
          node --test tests/test-polls-refresh-due.mjs
          node scripts/polls-refresh-due.mjs >> "$GITHUB_OUTPUT"

      - name: Setup Python for polling recovery
        if: steps.polls.outputs.due == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recover overdue political polls
        if: steps.polls.outputs.due == 'true'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python -m pip install -r scripts/polls-requirements.txt
          python -m unittest discover -s tests -p test_polls.py -v
          python scripts/update-polls.py
          if git diff --quiet -- polls.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add polls.json
          git commit -m "Recover overdue national polling archive"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1


