name: Update Google News feed

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate-news.mjs"
      - "source-policy.mjs"
      - "feed-images.mjs"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

concurrency:
  group: update-news-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate news.json
        run: node scripts/generate-news.mjs

      - name: Enrich video news
        run: node scripts/add-video-news.mjs

      - name: Enrich focus sections
        run: node scripts/enrich-focus-news.mjs

      - name: Commit updated feed
        run: |
          if git diff --quiet -- news.json; then
            echo "news.json unchanged"
            exit 0
          fi

          GENERATED_NEWS="$(mktemp)"
          cp news.json "$GENERATED_NEWS"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git fetch origin main
            git reset --hard origin/main
            cp "$GENERATED_NEWS" news.json

            if git diff --quiet -- news.json; then
              echo "news.json already current"
              exit 0
            fi

            git add news.json
            git commit -m "Update news feed"

            if git push origin HEAD:main; then
              echo "Push successful"
              exit 0
            fi

            echo "Push failed, retrying..."
            sleep 5
          done

          echo "Push failed after 3 attempts"
          exit 1
